# Integration Quality Scale — geprüft am 05.10.2026.
# Alle aktuellen Bronze-Regeln; tests_ha dokumentiert reproduzierbare Nachweise.
# Siehe Verwaltungsreview 2026-10-05-bronze-nachweise.md für die Grenzen.
rules:
  action-setup:
    status: done
    comment: >-
      async_setup registriert import_history unabhängig von geladenen
      Einträgen. Fehlender Runtime und nicht erfasste Entitäten erzeugen
      ServiceValidationError. tests_ha/test_actions.py prüft Registrierung,
      beide Fehler und Fortbestand nach Unload.
  appropriate-polling:
    status: exempt
    comment: >-
      `iot_class: local_push`. Standorte kommen als `EVENT_STATE_CHANGED`
      herein; der einzige Timer ist das nächtliche Aufräumen des Speichers.
  brands: done
  common-modules:
    status: exempt
    comment: >-
      Die Integration hat weder Coordinator noch Entitäten; es gibt nichts,
      was in `coordinator.py` oder `entity.py` gehörte.
  config-flow-test-coverage:
    status: done
    comment: >-
      tests_ha/test_config_flow.py führt echte HA-Flowmanager aus. Config-,
      Options- und vorhandene Reauth/Reconfigure-Flows einschließlich
      Fehler-Recovery und Dubletten: 100 % Zeilen- und Zweigabdeckung,
      --cov-branch --cov-fail-under=100, HA 2026.7.0 und 2026.9.2.
  config-flow: done
  dependency-transparency:
    status: todo
    comment: >-
      PyPI, OSI-Lizenz und öffentlicher Release-Tag für aiosqlite 0.20.0 belegt.
      Öffentliche Workflows am Tag enthalten Tests, aber keinen belegten
      Build-/Publish-Schritt zu PyPI. Dieser seit 30.09.2026 ausdrücklich
      geforderte Nachweis fehlt; deshalb kein quality_scale im Manifest.
  docs-actions:
    status: done
    comment: >-
      README, Abschnitt „Verlauf aus dem Recorder nachholen" beschreibt
      `localtrack.import_history` mit allen vier Feldern.
  docs-triggers:
    status: exempt
    comment: Keine eigenen Automations-Trigger bereitgestellt.
  docs-conditions:
    status: exempt
    comment: Keine eigenen Automations-Bedingungen bereitgestellt.
  docs-high-level-description:
    status: done
    comment: README, Abschnitt „Wofür das gut ist".
  docs-installation-instructions:
    status: done
    comment: README, Abschnitt „Installation über HACS" und „Einrichtung".
  docs-removal-instructions:
    status: done
    comment: README, Abschnitt „Entfernen".
  entity-event-setup:
    status: exempt
    comment: Die Integration legt keine Entitäten an.
  entity-unique-id:
    status: exempt
    comment: Die Integration legt keine Entitäten an.
  has-entity-name:
    status: exempt
    comment: Die Integration legt keine Entitäten an.
  runtime-data:
    status: done
    comment: >-
      `entry.runtime_data` hält die `LocalTrackRuntime`; `hass.data` wird nur
      zusätzlich für die WebSocket-Kommandos gefüllt, die keinen Eintrag
      kennen.
  test-before-configure:
    status: exempt
    comment: >-
      Es gibt kein Gerät und keinen Dienst, gegen den geprüft werden könnte —
      eingerichtet werden ausschließlich Entitäten der eigenen Installation.
      Der Flow prüft stattdessen, dass mindestens eine Entität gewählt wurde.
  test-before-setup:
    status: done
    comment: >-
      `async_setup_entry` öffnet die SQLite-Datei und wandelt jeden Fehler in
      `ConfigEntryNotReady` (__init__.py).
  unique-config-entry:
    status: done
    comment: >-
      `async_set_unique_id(DOMAIN)` plus `_abort_if_unique_id_configured()`;
      zusätzlich fängt `_async_current_entries()` Alt-Einträge ohne
      `unique_id` ab.
